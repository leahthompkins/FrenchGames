const IDLE_HOME_MS = 180000; // go back to the topic screen after 3 minutes untouched

const $ = id => document.getElementById(id);
let cat = null, qi = 0, idleTimer = null;

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  $(id).scrollTop = 0;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function goHome() { show("home"); }

function openCategory(c) {
  cat = c; qi = 0;
  document.body.style.setProperty("--c", c.color);
  $("cat-name").textContent = `${c.emoji} ${c.name}`;
  show("quiz");
  showQuestion();
}

function showQuestion() {
  const item = cat.questions[qi];
  $("count").textContent = `${qi + 1} / ${cat.questions.length}`;
  $("dots").innerHTML = cat.questions.map((_, i) =>
    `<span class="${i < qi ? "done" : i === qi ? "now" : ""}"></span>`).join("");
  $("question").textContent = item.q;
  $("card").classList.remove("answered");
  const answers = $("answers");
  answers.classList.remove("locked");
  answers.innerHTML = "";
  shuffle([item.a, ...item.w]).forEach(text => {
    const b = document.createElement("button");
    b.className = "ans";
    b.textContent = text;
    b.onclick = () => choose(b, text === item.a);
    answers.appendChild(b);
  });
}

function choose(btn, isRight) {
  const answers = $("answers");
  if (answers.classList.contains("locked")) return;
  answers.classList.add("locked");
  const item = cat.questions[qi];
  [...answers.children].forEach(b => {
    if (b.textContent === item.a) b.classList.add("right");
    else if (b === btn) b.classList.add("wrong");
    else b.classList.add("faded");
  });
  $("verdict").textContent = isRight ? "✅ Yes! That's right!" : `Good guess! The answer is: ${item.a}`;
  $("more").innerHTML = item.more.map(m => `<li>${m}</li>`).join("");
  $("next").textContent = qi === cat.questions.length - 1 ? "Finish 🎉" : "Next question →";
  $("card").classList.add("answered");
}

function next() {
  if (qi < cat.questions.length - 1) { qi++; showQuestion(); return; }
  $("done-emoji").textContent = cat.emoji;
  $("done-text").textContent = `You explored all ${cat.questions.length} questions about ${cat.name}!`;
  show("done");
}

// Build the topic buttons (clear first, in case the page was saved "as displayed")
$("cats").innerHTML = "";
$("answers").innerHTML = "";
document.body.removeAttribute("style");
CATEGORIES.forEach(c => {
  const b = document.createElement("button");
  b.className = "cat";
  b.style.background = c.color;
  b.innerHTML = `<span class="emoji">${c.emoji}</span>${c.name}`;
  b.onclick = () => openCategory(c);
  $("cats").appendChild(b);
});

$("back").onclick = goHome;
$("next").onclick = next;
$("done-btn").onclick = goHome;

// Return to the topic screen if the table is left alone
function resetIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(goHome, IDLE_HOME_MS); }
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, resetIdle));
resetIdle();
goHome();
</script>
