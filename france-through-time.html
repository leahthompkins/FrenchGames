<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>France Through Time</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #fff; color: #222; display: flex; flex-direction: column;
    user-select: none;
  }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 24px; }
  .flag { display: flex; width: 48px; height: 32px; border: 1px solid #ccc; flex: none; }
  .flag div { flex: 1; }
  header h1 { margin: 0; font-size: 28px; }

  main { flex: 1; display: flex; gap: 20px; padding: 0 24px; min-height: 0; }
  #map-wrap { flex: 1.4; min-width: 0; display: flex; align-items: center; justify-content: center; }
  svg { width: 100%; height: 100%; max-height: 100%; cursor: pointer; }
  .dep, .nb { transition: fill 1s, stroke 1s; stroke-linejoin: round; }
  .dep { stroke-width: 0.8; }
  .nb { stroke: #fff; stroke-width: 0.8; }
  #outline { fill: none; stroke: #222; stroke-width: 1.6; stroke-dasharray: 6 5; opacity: .45; pointer-events: none; }

  #info { flex: 1; min-width: 300px; max-width: 520px; display: flex; flex-direction: column; gap: 12px; padding-top: 6px; overflow-y: auto; }
  #year { font-size: 64px; font-weight: 800; line-height: 1; color: #0055A4; }
  #title { font-size: 30px; font-weight: 700; }
  #caption { font-size: 21px; line-height: 1.35; color: #333; }
  #legend { display: flex; flex-direction: column; gap: 6px; font-size: 17px; }
  #legend div { display: flex; align-items: center; gap: 10px; }
  #legend span.sw { width: 22px; height: 22px; border-radius: 4px; flex: none; border: 1px solid #0002; }
  #legend span.dash { width: 22px; border-top: 2px dashed #555; flex: none; }
  #facts { background: #fff7d6; border: 2px solid #f2d36b; border-radius: 12px; padding: 12px 18px; }
  #facts h2 { margin: 0 0 6px; font-size: 22px; }
  #facts ul { margin: 0; padding-left: 22px; font-size: 19px; line-height: 1.4; }
  #facts li { margin-bottom: 6px; }
  #hint { font-size: 17px; color: #777; }
  body.paused #hint { display: none; }

  footer { padding: 10px 24px 16px; display: flex; align-items: center; gap: 18px; }
  #play {
    font: inherit; font-size: 22px; font-weight: 700; border: none; border-radius: 12px;
    background: #0055A4; color: #fff; padding: 14px 22px; min-width: 150px; cursor: pointer;
  }
  body.paused #play { background: #EF4135; }
  .slider { flex: 1; }
  input[type=range] { width: 100%; height: 36px; accent-color: #0055A4; cursor: pointer; margin: 0; }
  #ticks { position: relative; height: 18px; margin: 0 8px; font-size: 13px; color: #555; }
  #ticks span { position: absolute; transform: translateX(-50%); cursor: pointer; white-space: nowrap; }
  #ticks span.on { color: #0055A4; font-weight: 800; }
  .credit { font-size: 11px; color: #999; padding: 0 24px 6px; }

  /* ---- Phones / narrow screens: stack everything in one scrolling column ---- */
  @media (max-width: 760px) {
    html, body { height: auto; }
    body { display: block; }
    header { padding: 12px 16px 6px; }
    header h1 { font-size: 19px; line-height: 1.25; }
    main { display: block; padding: 0 16px; }
    #map-wrap { height: 48vh; margin-bottom: 14px; }   /* explicit height: Safari won't collapse the map */
    svg { height: 100%; max-height: none; }
    #info { max-width: none; width: 100%; gap: 10px; padding-top: 0; overflow: visible; }
    #year { font-size: 46px; }
    #title { font-size: 24px; }
    #caption { font-size: 18px; }
    #legend { font-size: 16px; }
    #facts ul { font-size: 17px; }
    #facts h2 { font-size: 20px; }
    #hint { font-size: 15px; }

    /* Slider pinned to the bottom of the screen so it's always reachable */
    #facts { margin-bottom: 8px; }
    footer {
      position: -webkit-sticky; position: sticky; bottom: 0; flex-wrap: wrap; gap: 10px;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: #fff; border-top: 1px solid #e3e3e3; box-shadow: 0 -4px 10px rgba(0,0,0,.06);
    }
    #play { font-size: 18px; padding: 12px 16px; min-width: 120px; }
    .slider { flex: 1 1 100%; order: 2; }
    #ticks { display: none; }         /* year labels are too cramped on a phone */
    .credit { display: none; }        /* keep the phone view uncluttered */
  }
</style>
</head>
<body>
<header>
  <div class="flag"><div style="background:#0055A4"></div><div style="background:#fff"></div><div style="background:#EF4135"></div></div>
  <h1>France Through Time · La France à travers le temps</h1>
</header>

<main>
  <div id="map-wrap"><svg id="map"></svg></div>
  <div id="info">
    <div id="year"></div>
    <div id="title"></div>
    <div id="caption"></div>
    <div id="legend"></div>
    <div id="hint">⏸ Press <b>Pause</b> or tap the map to stay on this era.</div>
    <div id="facts"><h2>⭐ Fun facts</h2><ul id="fact-list"></ul></div>
  </div>
</main>

<footer>
  <button id="play">⏸ Pause</button>
  <div class="slider">
    <input type="range" id="slider" min="0" max="1000" step="any" value="0">
    <div id="ticks"></div>
  </div>
</footer>
<div class="credit">Maps are simplified and approximate. Shapes: IGN Admin Express (Licence Ouverte), Natural Earth.</div>

// ---- Build the map ----
const NS = "http://www.w3.org/2000/svg";
const LAND = "#ececec", SEA = "#dcecf7";
const svg = document.getElementById("map");
svg.innerHTML = ""; // clear, in case the page was saved "as displayed"
svg.setAttribute("viewBox", `0 0 ${GEO.w} ${GEO.h}`);
svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
const clip = el("clipPath", { id: "view" }, el("defs", {}));
el("rect", { x: 0, y: 0, width: GEO.w, height: GEO.h, rx: 12 }, clip);
const world = el("g", { "clip-path": "url(#view)" });
el("rect", { x: 0, y: 0, width: GEO.w, height: GEO.h, fill: SEA }, world);
const nbEls = {}, depEls = {};
for (const iso in GEO.nb) nbEls[iso] = el("path", { d: GEO.nb[iso].d, class: "nb", fill: LAND }, world);
for (const code in GEO.deps) depEls[code] = el("path", { d: GEO.deps[code].d, class: "dep" }, world);
el("path", { d: GEO.outline, id: "outline" }, world);
el("circle", { cx: GEO.paris[0], cy: GEO.paris[1], r: 6, fill: "#111", stroke: "#fff", "stroke-width": 2 });
const pl = el("text", { x: GEO.paris[0] + 10, y: GEO.paris[1] - 8, "font-size": 22, "font-weight": 700, fill: "#111", stroke: "#fff", "stroke-width": 4, "paint-order": "stroke" });
pl.textContent = "Paris";

// ---- UI ----
const $ = id => document.getElementById(id);
const slider = $("slider");
$("ticks").innerHTML = "";

// Timeline spacing: bigger gaps for longer spans of time (square-root scale, with a minimum gap)
const MIN_GAP = 6;
const yearNum = y => y === "Today" ? new Date().getFullYear()
  : y.endsWith("BC") ? -parseInt(y) : parseInt(y.replace("AD ", ""));
const POS = [0];
for (let i = 1; i < ERAS.length; i++)
  POS.push(POS[i - 1] + Math.max(MIN_GAP, Math.sqrt(yearNum(ERAS[i].year) - yearNum(ERAS[i - 1].year))));
POS.forEach((p, i) => POS[i] = p / POS[POS.length - 1] * 1000);
const nearestEra = v => POS.reduce((b, p, i) => Math.abs(p - v) < Math.abs(POS[b] - v) ? i : b, 0);

ERAS.forEach((e, i) => {
  const s = document.createElement("span");
  s.style.left = POS[i] / 10 + "%";
  s.textContent = e.year.replace("AD ", "");
  s.onclick = () => { pause(); go(i); };
  $("ticks").appendChild(s);
});

let idx = 0, playing = true, raf = null, t0 = 0, idleTimer = null;

function go(i) {
  idx = i;
  const era = ERAS[i];
  slider.value = POS[i];
  [...$("ticks").children].forEach((t, j) => t.classList.toggle("on", j === i));

  const owner = {};
  for (const code in depEls) owner[code] = era.base;
  for (const k in era.set) era.set[k].split(/\s+/).filter(Boolean).forEach(c => owner[c] = k);
  const used = new Set();
  for (const code in depEls) {
    const col = era.owners[owner[code]][0];
    depEls[code].setAttribute("fill", col);
    depEls[code].setAttribute("stroke", col);
    used.add(owner[code]);
  }
  const nbOwner = {};
  for (const k in era.nb) era.nb[k].split(/\s+/).filter(Boolean).forEach(c => nbOwner[c] = k);
  for (const iso in nbEls) {
    const k = nbOwner[iso];
    nbEls[iso].setAttribute("fill", k ? era.owners[k][0] : LAND);
    if (k) used.add(k);
  }

  $("year").textContent = era.year;
  $("title").textContent = era.title;
  $("caption").innerHTML = era.caption;
  $("legend").innerHTML = Object.keys(era.owners).filter(k => used.has(k))
    .map(k => `<div><span class="sw" style="background:${era.owners[k][0]}"></span>${era.owners[k][1]}</div>`).join("")
    + `<div><span class="dash"></span>Today's border of France</div>`;
  $("fact-list").innerHTML = era.facts.map(f => `<li>${f}</li>`).join("");
}

// While playing, glide the slider toward the next era, then switch maps
function tick(now) {
  if (!playing) return;
  const last = idx === ERAS.length - 1;
  const t = (now - t0) / (last ? LAST_MS : STEP_MS);
  if (t >= 1) { go((idx + 1) % ERAS.length); t0 = now; }
  else if (!last) slider.value = POS[idx] + t * (POS[idx + 1] - POS[idx]);
  raf = requestAnimationFrame(tick);
}
function schedule() {
  cancelAnimationFrame(raf);
  t0 = performance.now();
  raf = requestAnimationFrame(tick);
}
function play() {
  playing = true; clearTimeout(idleTimer);
  document.body.classList.remove("paused");
  $("play").textContent = "⏸ Pause";
  schedule();
}
function pause() {
  playing = false; cancelAnimationFrame(raf);
  slider.value = POS[idx];
  document.body.classList.add("paused");
  $("play").textContent = "▶ Play";
  clearTimeout(idleTimer);
  idleTimer = setTimeout(play, IDLE_RESUME_MS);
}

$("play").onclick = () => playing ? pause() : play();
svg.onclick = () => { if (playing) pause(); };
slider.oninput = () => { const i = nearestEra(+slider.value); pause(); go(i); };
document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === "ArrowRight") { pause(); go(Math.min(idx + 1, ERAS.length - 1)); }
  if (e.key === "ArrowLeft") { pause(); go(Math.max(idx - 1, 0)); }
});

go(0);
play();
</script>
